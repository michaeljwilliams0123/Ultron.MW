[mcp]
enabled = true

# Separate, optional WRITE-capable GitLab connection. This is never the
# read_api credential used by the read-only GitLab observer. Owner OAuth
# activation and per-operation signed grants are both required.
[[api]]
name          = "gitlab_write"
auth          = "oauth2"
base_url      = "https://gitlab.com"
authorize_url = "https://gitlab.com/oauth/authorize"
token_url     = "https://gitlab.com/oauth/token"
scopes        = ["api"]
required      = false
description   = "Privileged GitLab branch canary only; fixed project, signed grant and independent readback required."

[[cron]]
path = "/api/brain/tick"
schedule = "17 * * * *"

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_CLIENT_ID"
required = false
description = "Client ID of the Mahoraga-scoped GitHub App installation."

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_INSTALLATION_ID"
required = false
description = "Installation ID authorized only for the private Mahoraga repository."

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_PRIVATE_KEY"
required = false
description = "Private signing key for the Mahoraga-scoped GitHub App."

[[secret]]
name = "ULTRON_HF_GITHUB_WEBHOOK_SECRET"
required = false
description = "Owner-configured GitHub workflow_run webhook HMAC secret, minimum 32 unpredictable bytes. Distinct from existing custom Ultron signed-event bridge secret; fail-closed until GitHub hook configured."

[[secret]]
name = "ULTRON_EVENT_BRIDGE_HMAC_KEY"
required = false
description = "Private HMAC key for an authenticated Ultron event bridge; no unauthenticated GitHub webhook can bypass signed admission."

[[secret]]
name = "ULTRON_SECURITY_ADJUDICATOR_PUBLIC_JWK"
required = false
description = "Pinned ECDSA P-256 PUBLIC verification JWK for independently authorized, short-lived admin capability grants. No private key belongs in this runtime."

[[secret]]
name = "ULTRON_GRAPH_WORKBOOK_BINDING"
required = false
description = "Server-side JSON binding for one Microsoft account, workbook, worksheet and explicit allowed cells."

[[secret]]
name = "ULTRON_GRAPH_DELEGATED_TOKEN"
required = false
description = "Short-lived delegated Microsoft Graph token for the configured workbook account. Requires independent consent and rotation."

[[secret]]
name = "ULTRON_GITHUB_ISSUE_TOKEN"
required = false
description = "Least-privilege token with issue access only to michaeljwilliams0123/Ultron.MW. Never store the token in source or event receipts."

[[secret]]
name = "ULTRON_MAHORAGA_CONNECTION1026"
required = false
description = "Optional Mahoraga-only fine-grained PAT; only the protected hosted runtime may read this value. Never put it in source or event payloads."

[[secret]]
name = "ULTRON_MAHORAGA_CREDENTIAL_MODE"
required = false
description = "Optional exact credential mode: auto (legacy PAT-first), pat (no App fallback), or app (no PAT fallback). Configure independently before claiming App identity."

[[secret]]
name = "ULTRON_VAULT_KEY"
required = true
description = "Base64 32-byte AES-256-GCM key sealing owner credentials and council GitHub App private keys."
