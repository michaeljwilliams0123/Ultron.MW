[mcp]
enabled = true

# Native GitHub OAuth removes the unsupported App RSA signing dependency.
# Connect the dedicated Ultron GitHub account in protected Hatchable Setup.
# This connector is READ-VERIFIED ONLY until signed grant + durable executor
# independently approve each mutation. No token is stored in source.
[[api]]
name          = "github_operator"
auth          = "oauth2"
base_url      = "https://api.github.com"
authorize_url = "https://github.com/login/oauth/authorize"
token_url     = "https://github.com/login/oauth/access_token"
scopes        = ["read:user", "public_repo"]
required      = false
description   = "Dedicated Ultron user OAuth for public michaeljwilliams0123/Ultron.MW. Read-only identity checks initially; no automatic GitHub writes."

[api.headers]
Accept = "application/vnd.github+json"

# Separate, optional WRITE-capable GitLab connection. This is never the
# read_api credential used by the read-only GitLab observer. Owner OAuth
# activation and per-operation signed grants are both required.
[[api]]
name          = "gitlab_write"
auth          = "oauth2"
base_url      = "https://gitlab.com"
authorize_url = "https://gitlab.com/oauth/authorize"
token_url     = "https://gitlab.com/oauth/token"
scopes        = ["api"]
required      = false
description   = "Privileged GitLab branch canary only; fixed project, signed grant and independent readback required."

[[cron]]
path = "/api/brain/tick"
schedule = "17 * * * *"

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_CLIENT_ID"
required = false
description = "Client ID of the Mahoraga-scoped GitHub App installation."

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_INSTALLATION_ID"
required = false
description = "Installation ID authorized only for the private Mahoraga repository."

[[secret]]
name = "ULTRON_MAHORAGA_GITHUB_APP_PRIVATE_KEY"
required = false
description = "Private signing key for the Mahoraga-scoped GitHub App."

[[secret]]
name = "ULTRON_HF_GITHUB_WEBHOOK_SECRET"
required = false
description = "Owner-configured GitHub workflow_run webhook HMAC secret, minimum 32 unpredictable bytes. Distinct from existing custom Ultron signed-event bridge secret; fail-closed until GitHub hook configured."

[[secret]]
name = "ULTRON_EVENT_BRIDGE_HMAC_KEY"
required = false
description = "Private HMAC key for an authenticated Ultron event bridge; no unauthenticated GitHub webhook can bypass signed admission."

[[secret]]
name = "ULTRON_SECURITY_ADJUDICATOR_PUBLIC_JWK"
required = false
description = "Pinned ECDSA P-256 PUBLIC verification JWK for owner-issued, short-lived capability grants. No private key belongs in this runtime."

[[secret]]
name = "ULTRON_GRAPH_WORKBOOK_BINDING"
required = false
description = "Server-side JSON binding for one Microsoft account, workbook, worksheet and explicit allowed cells."

[[secret]]
name = "ULTRON_GRAPH_DELEGATED_TOKEN"
required = false
description = "Short-lived delegated Microsoft Graph token for the configured workbook account. Requires independent consent and rotation."

# Canonical Mike-owned GitHub App installation. Values are supplied only by
# the owner in Hatchable's protected Setup page; none are stored in source.
# These declarations do not grant access or enable an operator by themselves.
[[secret]]
name = "ULTRON_GITHUB_APP_ID"
required = false
description = "App ID installed with narrow permissions on michaeljwilliams0123/Ultron.MW (repository ID 1424939667)."

[[secret]]
name = "ULTRON_GITHUB_INSTALLATION_ID"
required = false
description = "Installation ID verified against GitHub for exactly michaeljwilliams0123/Ultron.MW; do not reuse another repository's installation."

[[secret]]
name = "ULTRON_GITHUB_APP_PRIVATE_KEY"
required = false
description = "Private PEM signing key of the verified Ultron GitHub App; owner-only protected setup, never paste in source or logs."

[[secret]]
name = "ULTRON_GITHUB_ISSUE_TOKEN"
required = false
description = "Optional legacy least-privilege issue token for michaeljwilliams0123/Ultron.MW; App installation is preferred. Never store the token in source or event receipts."

[[secret]]
name = "ULTRON_MAHORAGA_CONNECTION1026"
required = false
description = "Optional Mahoraga-only fine-grained PAT; only the protected hosted runtime may read this value. Never put it in source or event payloads."

[[secret]]
name = "ULTRON_MAHORAGA_CREDENTIAL_MODE"
required = false
description = "Optional exact credential mode: auto (legacy PAT-first), pat (no App fallback), or app (no PAT fallback). Configure independently before claiming App identity."

[[secret]]
name = "ULTRON_COUNCIL_MEMORY_MODE"
required = false
description = "Council memory store switch. Exactly 'postgres' enables Hatchable PostgreSQL council memory (migration 0043); any other value or unset keeps it OFF (fail closed). Not a credential."

[[secret]]
name = "ULTRON_COUNCIL_MEMORY_HMAC_KEY"
required = false
description = "Base64 key (at least 32 random bytes) that HMAC-seals council memory snapshots. Absent means council memory stays closed. Owner-only protected setup; never in source, logs or snapshots."

[[secret]]
name = "ULTRON_VAULT_KEY"
required = true
description = "Base64 32-byte AES-256-GCM key sealing owner credentials and council GitHub App private keys."

# Optional owner-consented GitLab API connection. No GitLab credential is
# stored in source, GitHub Actions, an MCP argument, or a task receipt.
[[api]]
name          = "gitlab"
auth          = "oauth2"
base_url      = "https://gitlab.com"
authorize_url = "https://gitlab.com/oauth/authorize"
token_url     = "https://gitlab.com/oauth/token"
scopes        = ["read_api"]
required      = false
description   = "Read-only private Ultron GitLab project CI observation; connect separately via owner OAuth."

[[secret]]
name = "ULTRON_PR_COMMENT_CANARY_ENABLED"
required = false
description = "Owner opt-in for the C04 PR-comment canary. Exactly 'true' enables it; unset or any other value keeps it disabled (default off)."


# UUAM: optional signed Cloudflare -> Hatchable staging inbox.
# Intentionally disabled unless owner configures the opt-in and shared HMAC.
# No value or privileged GitHub App credential is stored in source.
[[secret]]
name = "ULTRON_UUAM_DELIVERY_HMAC_KEY"
required = false
description = "Distinct 32+ character HMAC key for Cloudflare staged delivery; owner-supplied in protected Hatchable Setup. No default or environment exposure."

[[config]]
name = "uuam_inbox_enabled"
type = "boolean"
label = "Enable UUAM staging inbox"
help = "Enable only after 0047 has applied, signed delivery key custody is verified, and readback canaries pass. This allows inbox persistence, not execution."
default = false
