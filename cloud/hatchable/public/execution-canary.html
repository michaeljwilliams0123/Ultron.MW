<main><section><h1>Browser action canary</h1>
<p>This is a static, owner-controlled browser interaction test. No external write, session credential or paid browser service is used.</p>
<label for="work-input">Test instruction</label>
<input id="work-input" type="text" maxlength="160" autocomplete="off" value="">
<button id="run-task" type="button">Execute test interaction</button>
<p id="result" role="status" aria-live="polite">Not executed</p>
</section></main>
<script>
'use strict';
document.getElementById('run-task').addEventListener('click',()=>{
 const input=document.getElementById('work-input').value.trim();
 const result=document.getElementById('result');
 result.textContent=input?'Applied: '+input:'No instruction provided';
});
