name: Council GitHub App identity proof (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-principal:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.triggering_actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify one installed App principal and seven logical role labels
        env:
          ULTRON_GITHUB_APP_ID: ${{ vars.ULTRON_GITHUB_APP_ID }}
          ULTRON_GITHUB_INSTALLATION_ID: ${{ vars.ULTRON_GITHUB_INSTALLATION_ID }}
          ULTRON_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ULTRON_GITHUB_APP_PRIVATE_KEY }}
        run: node scripts/verify-council-fleet.mjs
      - name: Retain sanitized proof or held reason
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: council-principal-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/council-principal-proof.json
          if-no-files-found: warn
          retention-days: 7
