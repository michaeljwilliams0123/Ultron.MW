name: Owner-approved GitHub Actions canary (non-App fallback)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only by default; create means one isolated branch
        type: choice
        options:
          - read
          - create
        default: read
        required: true
      expected_sha:
        description: For create, type the exact current main SHA
        type: string
        required: false
      approval_phrase:
        description: For create, type APPROVE_ONE_OWNER_ACTIONS_CANARY
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: owner-actions-canary-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  read-only:
    if: >-
      github.repository == 'Ultron-MW/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.triggering_actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'read'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Inspect exact owner and repository without mutation
        env:
          OWNER_CANARY_MODE: read
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/owner-actions-canary.mjs
      - name: Persist sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-actions-read-${{ github.run_id }}
          path: artifacts/owner-actions-canary-*.json
          if-no-files-found: warn
          retention-days: 7
  one-branch:
    if: >-
      github.repository == 'Ultron-MW/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.triggering_actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'create' &&
      inputs.approval_phrase == 'APPROVE_ONE_OWNER_ACTIONS_CANARY'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Attempt exactly one explicitly approved isolated ref creation
        env:
          OWNER_CANARY_MODE: create
          OWNER_CANARY_EXPECTED_SHA: ${{ inputs.expected_sha }}
          OWNER_CANARY_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/owner-actions-canary.mjs
      - name: Persist sanitized write or uncertain-state evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-actions-create-${{ github.run_id }}
          path: artifacts/owner-actions-canary-*.json
          if-no-files-found: warn
          retention-days: 7
