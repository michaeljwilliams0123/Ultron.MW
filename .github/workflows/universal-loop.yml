name: Ultron universal reusable loop
# Universal multi-pattern loop engine supporting:
# 1. Dynamic Data Loop (Job Matrix via items_json)
# 2. Step-Level Shell Retry Loop (retry_attempts + retry_delay_seconds)
# 3. Bounded per-item iteration in one run (no recursive external dispatch)
# 4. Reusable workflow within the canonical public repository.
# Hosted runners are pinned; privileged dispatch is a separate owner-only job.
on:
  workflow_call:
    inputs:
      mode:
        description: 'Loop mode: matrix or recursive'
        required: false
        type: string
        default: 'matrix'
      action:
        description: 'Step action: noop-canary | dispatch-workflow | run-script'
        required: false
        type: string
        default: 'noop-canary'
      target:
        description: 'Workflow filename (for dispatch-workflow) or scripts/*.mjs path (for run-script)'
        required: false
        type: string
        default: ''
      items_json:
        description: 'JSON array of items to iterate over (1-25 items)'
        required: true
        type: string
      runner_labels:
        description: 'Optional JSON array of runner labels'
        required: false
        type: string
        default: ''
      retry_attempts:
        description: 'Step-level retry count per item (1-5)'
        required: false
        type: number
        default: 1
      retry_delay_seconds:
        description: 'Seconds between step-level retries (0-30)'
        required: false
        type: number
        default: 2
      iteration:
        description: 'Current recursive iteration (1-10)'
        required: false
        type: number
        default: 1
      max_iterations:
        description: 'Hard cap on recursive iterations (1-10)'
        required: false
        type: number
        default: 1
  workflow_dispatch:
    inputs:
      mode:
        description: 'Loop mode'
        required: true
        type: choice
        default: 'matrix'
        options:
          - matrix
          - recursive
      action:
        description: 'Step action'
        required: true
        type: choice
        default: 'noop-canary'
        options:
          - noop-canary
          - dispatch-workflow
          - run-script
      target:
        description: 'Workflow filename (dispatch-workflow) or scripts/*.mjs path (run-script)'
        required: false
        default: ''
        type: string
      items_json:
        description: 'JSON array of items to iterate over (1-25 items)'
        required: true
        default: '["task-1", "task-2", "task-3"]'
        type: string
      runner_labels:
        description: 'Optional JSON array of runner labels'
        required: false
        default: ''
        type: string
      retry_attempts:
        description: 'Step-level retry count per item (1-5)'
        required: false
        default: '1'
        type: string
      retry_delay_seconds:
        description: 'Seconds between step-level retries (0-30)'
        required: false
        default: '2'
        type: string
      iteration:
        description: 'Current recursive iteration (1-10)'
        required: false
        default: '1'
        type: string
      max_iterations:
        description: 'Hard cap on recursive iterations (1-10)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: ultron-universal-loop-${{ github.ref }}-${{ inputs.mode || 'matrix' }}
  cancel-in-progress: false

jobs:
  prepare-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      items: ${{ steps.set-list.outputs.items }}
      runner_labels: ${{ steps.set-list.outputs.runner_labels }}
      retry_attempts: ${{ steps.set-list.outputs.retry_attempts }}
      retry_delay_seconds: ${{ steps.set-list.outputs.retry_delay_seconds }}
      iteration: ${{ steps.set-list.outputs.iteration }}
      max_iterations: ${{ steps.set-list.outputs.max_iterations }}
      should_recurse: ${{ steps.set-list.outputs.should_recurse }}
      next_iteration: ${{ steps.set-list.outputs.next_iteration }}
    steps:
      - name: Validate loop bounds, matrix items, and runner labels
        id: set-list
        env:
          MODE: ${{ inputs.mode || 'matrix' }}
          ACTION: ${{ inputs.action || 'noop-canary' }}
          TARGET: ${{ inputs.target || '' }}
          ITEMS_JSON: ${{ inputs.items_json }}
          INPUT_RUNNER_LABELS: ${{ inputs.runner_labels }}
          VAR_RUNNER_LABELS: ${{ vars.ULTRON_RUNNER_LABELS }}
          RETRY_ATTEMPTS: ${{ inputs.retry_attempts }}
          RETRY_DELAY: ${{ inputs.retry_delay_seconds }}
          ITERATION: ${{ inputs.iteration }}
          MAX_ITERATIONS: ${{ inputs.max_iterations }}
          REPO_PRIVATE: '${{ github.event.repository.private }}'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const mode = process.env.MODE;
          if (!['matrix', 'recursive'].includes(mode)) throw new Error('Invalid mode');
          const action = process.env.ACTION;
          if (!['noop-canary', 'dispatch-workflow', 'run-script'].includes(action)) throw new Error('Invalid action');
          const target = (process.env.TARGET || '').trim();
          const canonical = process.env.GITHUB_REPOSITORY === 'michaeljwilliams0123/Ultron.MW';
          if (!canonical || process.env.REPO_PRIVATE !== 'false') throw new Error('Canonical public repository required');
          const ownerManualMain = process.env.GITHUB_ACTOR_ID === '308995719' &&
            process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' &&
            process.env.GITHUB_REF === 'refs/heads/main';
          const allowedScripts = new Set([
            'scripts/check-workflow-references.mjs',
            'scripts/check-cloudflare-parity.mjs',
            'scripts/audit-secret-isolation.mjs',
          ]);
          if (action !== 'noop-canary' && !ownerManualMain) throw new Error('Owner manual main required');
          if (action === 'dispatch-workflow' && target !== 'contract-validation.yml') throw new Error('Workflow not allowlisted');
          if (action === 'run-script' && !allowedScripts.has(target)) throw new Error('Script not allowlisted');
          if (action === 'noop-canary' && target) throw new Error('Noop requires empty target');
          if (action === 'dispatch-workflow' && !/^[A-Za-z0-9_.-]+\.ya?ml$/.test(target)) {
            throw new Error('dispatch-workflow target must be a workflow filename (e.g. contract-validation.yml)');
          }
          if (action === 'run-script' && !/^scripts\/[A-Za-z0-9_.-]+\.mjs$/.test(target)) {
            throw new Error('run-script target must be confined to scripts/*.mjs');
          }
          const items = JSON.parse(process.env.ITEMS_JSON || '[]');
          if (!Array.isArray(items) || items.length === 0 || items.length > 25) {
            throw new Error('items_json must be a non-empty JSON array (max 25 items)');
          }
          if (items.some(i => typeof i !== 'string' || !/^[A-Za-z0-9_.:-]{1,80}$/.test(i)) || new Set(items).size !== items.length) {
            throw new Error('Items must be unique bounded identifiers');
          }
          const rawRunner = (process.env.INPUT_RUNNER_LABELS || process.env.VAR_RUNNER_LABELS || '["ubuntu-24.04"]').trim();
          const runner = JSON.parse(rawRunner);
          if (!Array.isArray(runner) || runner.length !== 1 || runner[0] !== 'ubuntu-24.04') {
            throw new Error('runner_labels must be a non-empty JSON array');
          }
          const retries = Math.min(5, Math.max(1, Number.parseInt(process.env.RETRY_ATTEMPTS || '1', 10) || 1));
          const delay = Math.min(30, Math.max(0, Number.parseInt(process.env.RETRY_DELAY || '2', 10) || 0));
          const iter = Math.min(10, Math.max(1, Number.parseInt(process.env.ITERATION || '1', 10) || 1));
          const maxIter = Math.min(10, Math.max(1, Number.parseInt(process.env.MAX_ITERATIONS || '1', 10) || 1));
          const endIter = mode === 'recursive' ? maxIter : iter;
          if (iter > endIter || (mode === 'matrix' && (iter !== 1 || maxIter !== 1))) throw new Error('Invalid iteration range');
          if (items.length * (endIter - iter + 1) * retries > 125) throw new Error('Total attempt budget exceeded');
          if (action === 'dispatch-workflow' && (mode !== 'matrix' || items.length !== 1 || retries !== 1)) {
            throw new Error('Dispatch requires one item, one attempt, no recursion');
          }
          const shouldRecurse = false;

          const out = [
            `items=${JSON.stringify(items)}`,
            `runner_labels=${JSON.stringify(runner)}`,
            `retry_attempts=${retries}`,
            `retry_delay_seconds=${delay}`,
            `iteration=${iter}`,
            `max_iterations=${endIter}`,
            `should_recurse=${shouldRecurse}`,
            `next_iteration=${iter + 1}`
          ].join('\n') + '\n';
          appendFileSync(process.env.GITHUB_OUTPUT, out);
          NODE

  execute-loop:
    needs: prepare-list
    if: inputs.action != 'dispatch-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        item: ${{ fromJson(needs.prepare-list.outputs.items) }}
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.action == 'run-script'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.action == 'run-script'
        with:
          node-version: '22'
      - name: Execute bounded retry loop for matrix item
        env:
          MATRIX_ITEM: ${{ matrix.item }}
          LOOP_ACTION: ${{ inputs.action || 'noop-canary' }}
          LOOP_TARGET: ${{ inputs.target || '' }}
          MAX_RETRIES: ${{ needs.prepare-list.outputs.retry_attempts }}
          RETRY_DELAY: ${{ needs.prepare-list.outputs.retry_delay_seconds }}
          ITERATION: ${{ needs.prepare-list.outputs.iteration }}
          MAX_ITERATIONS: ${{ needs.prepare-list.outputs.max_iterations }}
        shell: bash
        run: |
          set -euo pipefail
          iteration="$ITERATION"
          while [ "$iteration" -le "$MAX_ITERATIONS" ]; do
            attempt=1
            while true; do
              echo "[iter=$iteration item=$MATRIX_ITEM attempt=$attempt/$MAX_RETRIES] action=$LOOP_ACTION"
              rc=0
              case "$LOOP_ACTION" in
                noop-canary) echo "Canary OK for item=$MATRIX_ITEM iteration=$iteration" ;;
                run-script) node "$LOOP_TARGET" --item "$MATRIX_ITEM" || rc=$? ;;
                *) exit 2 ;;
              esac
              if [ "$rc" -eq 0 ]; then break; fi
              if [ "$attempt" -ge "$MAX_RETRIES" ]; then exit "$rc"; fi
              attempt=$((attempt + 1))
              sleep "$RETRY_DELAY"
            done
            iteration=$((iteration + 1))
          done

  dispatch-contract:
    needs: prepare-list
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'michaeljwilliams0123' &&
      github.actor_id == '308995719' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'dispatch-workflow' &&
      inputs.target == 'contract-validation.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch allowlisted contract validation once
        run: gh workflow run contract-validation.yml --repo "$GITHUB_REPOSITORY" --ref main
