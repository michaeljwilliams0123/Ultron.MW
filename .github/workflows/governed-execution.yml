name: Governed Task Runner
on:
  workflow_dispatch:
    inputs:
      raw_payload:
        description: 'JSON payload for a bounded, read-only governed operation'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  execute_task:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Execute bounded governed request as data
        env:
          UNTRUSTED_PAYLOAD: ${{ inputs.raw_payload }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/governed-execution.mjs
