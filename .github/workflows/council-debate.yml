name: Ultron Council Multi-Agent Debate Loop

on:
  issues:
    types: [opened, labeled, edited]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:
    inputs:
      council_task:
        description: Council task (debate is the default used by dispatchers)
        required: false
        type: choice
        default: debate
        options:
          - debate
          - identity-proof
          - principal-proof
      item_number:
        description: 'debate: issue or PR number'
        required: false
      is_pr:
        description: 'debate: true if PR'
        required: true
        default: 'false'
      role:
        description: 'identity-proof: logical Council role attributed to the one verified Coordinator App'
        required: false
        type: choice
        options: [BUILDER, SKEPTIC, STEWARD, PREDICTOR, GENERATOR, SENTINEL, COMPANION]
        default: BUILDER
      issue_number:
        description: 'identity-proof: issue or PR number to receive the proof comment'
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: ultron-council-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.item_number || github.run_id }}
  cancel-in-progress: false

jobs:
  council-debate:
    if: >-
      (github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.council_task == 'debate' || inputs.council_task == '')) &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'issues' && (
          github.event.sender.login == 'michaeljwilliams0123' ||
          contains(join(github.event.issue.labels.*.name, ','), 'feature') ||
          contains(join(github.event.issue.labels.*.name, ','), 'proposal') ||
          contains(join(github.event.issue.labels.*.name, ','), 'council')
        )) ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.login == 'michaeljwilliams0123' &&
          contains(github.event.comment.body, '/council'))
      )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run computer and signed-event security regressions
        run: node --test test/computer-executor.test.mjs test/hatchable-signed-event-inbox.test.mjs

      # Payload via context in JS — never embed issue body expressions in YAML (workflow-security).
      - name: Extract context (owner-first, hardened)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.env.RUNNER_TEMP, 'ultron-council');
            fs.mkdirSync(dir, { recursive: true });
            const actor = context.actor || '';
            const ownerMode = actor === 'michaeljwilliams0123' ? '1' : '0';
            let title = '';
            let body = '';
            let itemNumber = 0;
            let isPr = 'false';
            let originalIssueBody = '';
            let securitySignal = false;
            let targetSourceSha = '';
            const riskWords = ['secret','credential','token','password','bypass security','fail-open','delete main','force push'];
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request || {};
              targetSourceSha = String(pr.head?.sha || '');
              title = String(pr.title || '');
              body = String(pr.body || '');
              itemNumber = Number(pr.number) || 0;
              isPr = 'true';
            } else if (context.eventName === 'issues') {
              const issue = context.payload.issue || {};
              title = String(issue.title || '');
              body = String(issue.body || '');
              itemNumber = Number(issue.number) || 0;
            } else if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue || {};
              const comment = context.payload.comment || {};
              title = String(issue.title || '');
              body = String(comment.body || '');
              originalIssueBody = String(issue.body || '');
              itemNumber = Number(issue.number) || 0;
              isPr = issue.pull_request ? 'true' : 'false';
            } else if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {};
              itemNumber = Number(inputs.item_number);
              isPr = String(inputs.is_pr || 'false');
              if (!Number.isSafeInteger(itemNumber) || itemNumber < 1 ||
                  !['true','false'].includes(isPr))
                throw Error('Council dispatch target invalid');
              const selector = {owner:context.repo.owner,repo:context.repo.repo};
              const response = isPr === 'true'
                ? await github.rest.pulls.get({...selector,pull_number:itemNumber})
                : await github.rest.issues.get({...selector,issue_number:itemNumber});
              const target = response.data;
              if (isPr === 'true') targetSourceSha = String(target.head?.sha || '');
              if (isPr === 'false' && target.pull_request)
                throw Error('Council dispatch target type mismatch');
              if (target.state !== 'open') throw Error('Council dispatch target not open');
              title = String(target.title || '');
              body = String(target.body || '').slice(0,6000);
              const fullBody = String(target.body || '').toLowerCase();
              securitySignal = riskWords.some(word=>
                title.toLowerCase().includes(word) || fullBody.includes(word));
              // Include the latest genuine owner update when available, but
              // never replace the authoritative issue/PR title and body.
              if (isPr === 'false') {
                const total = Math.max(1,Math.ceil((target.comments || 0)/100));
                let latestOwner = null;
                for (let page=total;page>=1&&page>total-10;page--) {
                  const response = await github.rest.issues.listComments({
                    ...selector,issue_number:itemNumber,per_page:100,page
                  });
                  latestOwner = [...response.data].reverse().find(comment =>
                    comment.user?.login === 'michaeljwilliams0123' &&
                    !/^\s*\/council\b/.test(comment.body || ''));
                  if (latestOwner) break;
                }
                if (latestOwner) {
                  // Scan complete owner text; display clipping must not hide security context.
                  securitySignal = securitySignal || riskWords.some(word =>
                    String(latestOwner.body || '').toLowerCase().includes(word));
                  const ownerUpdate = '\n\nLatest owner update:\n' +
                    String(latestOwner.body || '').slice(0,1800);
                  // A workflow-dispatched run uses a bot actor ('0' is truthy).
                  // Reserve room inside the actual debate parser's baseline cap.
                  const bodyLimit = ownerMode === '1' ? 8000 : 3000;
                  body = body.slice(0,Math.max(0,bodyLimit-ownerUpdate.length)) +
                    ownerUpdate;
                }
              }
            } else {
              throw Error('Council dispatch event unsupported');
            }
            // Security classification applies to every trigger, including
            // the original issue body on owner-comment events. Classify
            // before title/body display clipping; no event may inherit a
            // missing signal merely because it bypassed workflow_dispatch.
            securitySignal = securitySignal || riskWords.some(word =>
              [title,body,originalIssueBody].some(value =>
                String(value).toLowerCase().includes(word)));
            core.exportVariable('ORIGINAL_SECURITY_SIGNAL',securitySignal?'1':'0');
            fs.writeFileSync(path.join(dir, 'title.txt'), title.slice(0, 240));
            fs.writeFileSync(path.join(dir, 'body.txt'), body.slice(0, 8000));
            core.exportVariable('OWNER_MODE', ownerMode);
            core.exportVariable('IS_PR', isPr);
            core.exportVariable('ITEM_NUMBER', String(itemNumber));
            core.exportVariable('TARGET_SOURCE_SHA', targetSourceSha);
            core.exportVariable('TITLE_FILE', path.join(dir, 'title.txt'));
            core.exportVariable('BODY_FILE', path.join(dir, 'body.txt'));

            // Execute read-only CI validation within this *trusted* extraction
            // step. Council runs from main; no PR-supplied code is executed.
            if (isPr === 'true') {
              let observed = {};
              try {
                const sha = targetSourceSha;
                if (!/^[a-f0-9]{40}$/.test(sha||'') ||
                    !Number.isSafeInteger(itemNumber) || itemNumber<1)
                  throw Error('invalid-exact-head-pr-target');
                const current = (await github.rest.pulls.get({
                  owner:context.repo.owner,repo:context.repo.repo,
                  pull_number:itemNumber
                })).data;
                if (current.state!=='open'||current.head?.sha!==sha)
                  throw Error('council-head-drift');
                const [checks,comparison] = await Promise.all([
                  github.rest.checks.listForRef({
                    owner:context.repo.owner,repo:context.repo.repo,
                    ref:sha,per_page:100
                  }),
                  github.rest.repos.compareCommits({
                    owner:context.repo.owner,repo:context.repo.repo,
                    base:current.base.sha,head:sha
                  })
                ]);
                if (checks.data?.total_count>100)
                  throw Error('check-inventory-truncated');
                observed={pr:current,comparison:comparison.data,checkRuns:checks.data};
              } catch (error) {
                core.warning?.('Council CI evidence remains unverified: '+error.message);
              }
              const source=path.join(dir,'exact-head-ci.json');
              fs.writeFileSync(source,JSON.stringify(observed));
              core.exportVariable('COUNCIL_REVIEW_EVIDENCE_FILE',source);
            }

      - name: Run owner-first council debate
        id: debate
        env:
          TITLE_FILE: ${{ env.TITLE_FILE }}
          BODY_FILE: ${{ env.BODY_FILE }}
          ITEM_NUMBER: ${{ env.ITEM_NUMBER }}
          TARGET_SOURCE_SHA: ${{ env.TARGET_SOURCE_SHA }}
          IS_PR: ${{ env.IS_PR }}
          OWNER_MODE: ${{ env.OWNER_MODE }}
          ORIGINAL_SECURITY_SIGNAL: ${{ env.ORIGINAL_SECURITY_SIGNAL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/council-debate.mjs ]; then
            echo "Council script not on trusted main yet (pre-merge). Skipping execute."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2155
          TITLE=$(cat "$TITLE_FILE")
          # shellcheck disable=SC2155
          BODY=$(cat "$BODY_FILE")
          export TITLE BODY
          node --check src/grokbot-governor.mjs
          node --check scripts/council-debate.mjs
          node scripts/council-debate.mjs

      - name: Post council report + action board
        if: steps.debate.outputs.skipped != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ITEM_NUMBER: ${{ env.ITEM_NUMBER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path=require('node:path');
            const {pathToFileURL}=require('node:url');
            // Pull-request workflows check out trusted main. Until the stable
            // publication module and artifact are merged there, do not import
            // candidate-only code or post an unverifiable replacement report.
            if(!fs.existsSync('council-publication.json')){
              core.info('Council publication v2 absent on trusted main; source-only candidate, no comment.');
              return;
            }
            const {alreadyPublished}=await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE,'src/council-publication.mjs')).href);
            const publication=JSON.parse(fs.readFileSync('council-publication.json','utf8'));
            const synthesis = fs.readFileSync('FINAL_SYNTHESIS.md', 'utf8').slice(0, 60000);
            const critique = fs.readFileSync('CRITIQUE_MATRIX.md', 'utf8').slice(0, 25000);
            const body = `${synthesis}\n\n<details><summary><b>Stages 2–3 (Crucible + Rebuttal)</b></summary>\n\n${critique}\n\n</details>`;
            const itemNumber = parseInt(process.env.ITEM_NUMBER, 10);
            if (!Number.isFinite(itemNumber) || itemNumber < 1) {
              core.setFailed('Missing ITEM_NUMBER');
              return;
            }
            // Per-item workflow concurrency prevents same-target racing.
            // Paginate completely: partial history must hold rather than claim no duplicate.
            const previous=await github.paginate(github.rest.issues.listComments,{
              owner:context.repo.owner,repo:context.repo.repo,
              issue_number:itemNumber,per_page:100
            });
            if(alreadyPublished(publication,previous)){
              core.info('Council evidence unchanged: '+publication.fingerprint+
                '; suppress duplicate report, no GitHub write.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: itemNumber,
              body,
            });
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                labels: ['council-reviewed'],
              });
            } catch (e) {
              core.info('Label council-reviewed skipped: ' + e.message);
            }

      - name: Council members act under their own App identities
        if: >-
          steps.debate.outputs.skipped != 'true' &&
          env.OWNER_MODE == '1' &&
          (github.event_name == 'issues' || github.event_name == 'workflow_dispatch')
        env:
          COUNCIL_LEDGER_REQUIRED: ${{ vars.COUNCIL_LEDGER_REQUIRED }}
        run: node scripts/council-act.mjs

      - name: Upload receipt artifact
        if: always() && steps.debate.outputs.skipped != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: council-debate-${{ github.run_id }}
          path: |
            FINAL_SYNTHESIS.md
            CRITIQUE_MATRIX.md
            RFC_DRAFT.md
            council-receipt.json
            council-publication.json
            council-members.json
            council-execution-ledger.json
            council-execution-receipts.json
          if-no-files-found: ignore
          retention-days: 30

  prove:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.council_task == 'identity-proof' && inputs.issue_number != '') &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.triggering_actor == 'michaeljwilliams0123' &&
      github.repository_id == 1424939667 &&
      github.repository_owner_id == 308995719 &&
      github.ref == 'refs/heads/main'
      )
    permissions:
      contents: read
    concurrency:
      group: council-identity-proof-${{ inputs.role }}-prove
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Mint short-lived installation token for this role only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ULTRON_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.ULTRON_BUILDER_PRIVATE_KEY }}
          repositories: Ultron.MW
          permission-issues: write
          permission-contents: read
      - name: Verify minted App provenance before any write
        env:
          ACTUAL_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          test "$ACTUAL_APP_SLUG" = "ultron-coordinator" ||
            { echo 'Coordinator App slug mismatch'; exit 1; }
      - name: Post proof comment as the App and verify authorship by readback
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          ROLE_UPPER: ${{ inputs.role }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          role_lower="${ROLE_UPPER,,}"
          export COUNCIL_ROLE="${role_lower^}"
          node scripts/council-identity-proof.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: council-identity-proof-${{ inputs.role }}
          path: council-identity-proof.json
          if-no-files-found: ignore
          retention-days: 90

  verify-principal:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.council_task == 'principal-proof') &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.triggering_actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main'
      )
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Diagnose Coordinator App and repository installation
        env:
          ULTRON_GITHUB_APP_ID: ${{ vars.ULTRON_GITHUB_APP_ID }}
          ULTRON_BUILDER_PRIVATE_KEY: ${{ secrets.ULTRON_BUILDER_PRIVATE_KEY }}
        run: node scripts/diagnose-council-installation.mjs
      - name: Discover Ultron Coordinator installation
        id: coordinator
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ULTRON_BUILDER_CLIENT_ID }}
          private-key: ${{ secrets.ULTRON_BUILDER_PRIVATE_KEY }}
          permission-metadata: read
      - name: Assert authenticated Coordinator app identity
        env:
          ACTUAL_APP_SLUG: ${{ steps.coordinator.outputs.app-slug }}
          EXPECTED_APP_ID: ${{ vars.ULTRON_GITHUB_APP_ID }}
        run: |
          if [ "$ACTUAL_APP_SLUG" != "ultron-coordinator" ]; then
            echo "Coordinator app slug mismatch"
            exit 1
          fi
          if [ "$EXPECTED_APP_ID" != "5633654" ]; then
            echo "Coordinator numeric App ID mismatch"
            exit 1
          fi
      - name: Verify one installed App principal and seven logical role labels
        env:
          ULTRON_GITHUB_APP_ID: ${{ vars.ULTRON_GITHUB_APP_ID }}
          ULTRON_GITHUB_INSTALLATION_ID: ${{ steps.coordinator.outputs.installation-id }}
          ULTRON_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ULTRON_BUILDER_PRIVATE_KEY }}
        run: node scripts/verify-council-fleet.mjs
      - name: Retain sanitized proof or held reason
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: council-principal-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/council-app-installation-diagnostic.json
            artifacts/council-principal-proof.json
          if-no-files-found: warn
          retention-days: 7
