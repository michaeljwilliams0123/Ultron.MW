name: Ultron Council Multi-Agent Debate Loop

on:
  issues:
    types: [opened, labeled, edited]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:
    inputs:
      item_number:
        description: 'Issue or PR number'
        required: true
      is_pr:
        description: 'true if PR'
        required: true
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ultron-council-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  council-debate:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'issues' && (
          github.event.sender.login == 'michaeljwilliams0123' ||
          contains(join(github.event.issue.labels.*.name, ','), 'feature') ||
          contains(join(github.event.issue.labels.*.name, ','), 'proposal') ||
          contains(join(github.event.issue.labels.*.name, ','), 'council')
        )) ||
        (github.event_name == 'issue_comment' &&
          github.event.comment.user.login == 'michaeljwilliams0123' &&
          contains(github.event.comment.body, '/council'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Payload via context in JS — never embed issue body expressions in YAML (workflow-security).
      - name: Extract context (owner-first, hardened)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = path.join(process.env.RUNNER_TEMP, 'ultron-council');
            fs.mkdirSync(dir, { recursive: true });
            const actor = context.actor || '';
            const ownerMode = actor === 'michaeljwilliams0123' ? '1' : '0';
            let title = '';
            let body = '';
            let itemNumber = 0;
            let isPr = 'false';
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request || {};
              title = String(pr.title || '');
              body = String(pr.body || '');
              itemNumber = Number(pr.number) || 0;
              isPr = 'true';
            } else if (context.eventName === 'issues') {
              const issue = context.payload.issue || {};
              title = String(issue.title || '');
              body = String(issue.body || '');
              itemNumber = Number(issue.number) || 0;
            } else if (context.eventName === 'issue_comment') {
              const issue = context.payload.issue || {};
              const comment = context.payload.comment || {};
              title = String(issue.title || '');
              body = String(comment.body || '');
              itemNumber = Number(issue.number) || 0;
            } else if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {};
              itemNumber = Number(inputs.item_number);
              isPr = String(inputs.is_pr || 'false');
              if (!Number.isSafeInteger(itemNumber) || itemNumber < 1 ||
                  !['true','false'].includes(isPr))
                throw Error('Council dispatch target invalid');
              const selector = {owner:context.repo.owner,repo:context.repo.repo};
              const response = isPr === 'true'
                ? await github.rest.pulls.get({...selector,pull_number:itemNumber})
                : await github.rest.issues.get({...selector,issue_number:itemNumber});
              const target = response.data;
              if (isPr === 'false' && target.pull_request)
                throw Error('Council dispatch target type mismatch');
              if (target.state !== 'open') throw Error('Council dispatch target not open');
              title = String(target.title || '');
              body = String(target.body || '').slice(0,6000);
              const fullBody = String(target.body || '').toLowerCase();
              const riskWords = ['secret','credential','token','password','bypass security','fail-open','delete main','force push'];
              let securitySignal = riskWords.some(word=>fullBody.includes(word));
              // Include the latest genuine owner update when available, but
              // never replace the authoritative issue/PR title and body.
              if (isPr === 'false') {
                const total = Math.max(1,Math.ceil((target.comments || 0)/100));
                let latestOwner = null;
                for (let page=total;page>=1&&page>total-10;page--) {
                  const response = await github.rest.issues.listComments({
                    ...selector,issue_number:itemNumber,per_page:100,page
                  });
                  latestOwner = [...response.data].reverse().find(comment =>
                    comment.user?.login === 'michaeljwilliams0123' &&
                    !/^\s*\/council\b/.test(comment.body || ''));
                  if (latestOwner) break;
                }
                if (latestOwner) {
                  // Scan complete owner text; display clipping must not hide security context.
                  securitySignal = securitySignal || riskWords.some(word =>
                    String(latestOwner.body || '').toLowerCase().includes(word));
                  const ownerUpdate = '\n\nLatest owner update:\n' +
                    String(latestOwner.body || '').slice(0,1800);
                  // A workflow-dispatched run uses a bot actor ('0' is truthy).
                  // Reserve room inside the actual debate parser's baseline cap.
                  const bodyLimit = ownerMode === '1' ? 8000 : 3000;
                  body = body.slice(0,Math.max(0,bodyLimit-ownerUpdate.length)) +
                    ownerUpdate;
                }
              }
              core.exportVariable('ORIGINAL_SECURITY_SIGNAL',securitySignal?'1':'0');
            } else {
              throw Error('Council dispatch event unsupported');
            }
            fs.writeFileSync(path.join(dir, 'title.txt'), title.slice(0, 240));
            fs.writeFileSync(path.join(dir, 'body.txt'), body.slice(0, 8000));
            core.exportVariable('OWNER_MODE', ownerMode);
            core.exportVariable('IS_PR', isPr);
            core.exportVariable('ITEM_NUMBER', String(itemNumber));
            core.exportVariable('TITLE_FILE', path.join(dir, 'title.txt'));
            core.exportVariable('BODY_FILE', path.join(dir, 'body.txt'));

      - name: Run owner-first council debate
        id: debate
        env:
          TITLE_FILE: ${{ env.TITLE_FILE }}
          BODY_FILE: ${{ env.BODY_FILE }}
          ITEM_NUMBER: ${{ env.ITEM_NUMBER }}
          IS_PR: ${{ env.IS_PR }}
          OWNER_MODE: ${{ env.OWNER_MODE }}
          ORIGINAL_SECURITY_SIGNAL: ${{ env.ORIGINAL_SECURITY_SIGNAL }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/council-debate.mjs ]; then
            echo "Council script not on trusted main yet (pre-merge). Skipping execute."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2155
          TITLE=$(cat "$TITLE_FILE")
          # shellcheck disable=SC2155
          BODY=$(cat "$BODY_FILE")
          export TITLE BODY
          node --check src/grokbot-governor.mjs
          node --check scripts/council-debate.mjs
          node scripts/council-debate.mjs

      - name: Post council report + action board
        if: steps.debate.outputs.skipped != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          ITEM_NUMBER: ${{ env.ITEM_NUMBER }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const synthesis = fs.readFileSync('FINAL_SYNTHESIS.md', 'utf8').slice(0, 60000);
            const critique = fs.readFileSync('CRITIQUE_MATRIX.md', 'utf8').slice(0, 25000);
            const body = `${synthesis}\n\n<details><summary><b>Stages 2–3 (Crucible + Rebuttal)</b></summary>\n\n${critique}\n\n</details>`;
            const itemNumber = parseInt(process.env.ITEM_NUMBER, 10);
            if (!Number.isFinite(itemNumber) || itemNumber < 1) {
              core.setFailed('Missing ITEM_NUMBER');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: itemNumber,
              body,
            });
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: itemNumber,
                labels: ['council-reviewed'],
              });
            } catch (e) {
              core.info('Label council-reviewed skipped: ' + e.message);
            }

      - name: Upload receipt artifact
        if: always() && steps.debate.outputs.skipped != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: council-debate-${{ github.run_id }}
          path: |
            FINAL_SYNTHESIS.md
            CRITIQUE_MATRIX.md
            RFC_DRAFT.md
            council-receipt.json
          if-no-files-found: ignore
          retention-days: 30
