name: Ultron Hugging Face OIDC evidence bridge
on:
  workflow_run:
    workflows:
      - Ultron Hugging Face held-out CPU repairs
      - Ultron Hugging Face free CPU tournament
      - Ultron C06 real model-generated release candidate
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "An already-completed, owner-generated HF/C06 workflow run ID"
        required: true
        type: string
      run_attempt:
        description: "Source workflow attempt"
        default: "1"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hf-oidc-bridge-${{ github.event.workflow_run.id || inputs.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.run_attempt || '1' }}
  cancel-in-progress: false
jobs:
  post-signed-receipt:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.actor.login == 'michaeljwilliams0123') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'michaeljwilliams0123'))
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      id-token: write
    env:
      ULTRON_PAID_BUDGET_CENTS: '0'
    steps:
      - name: Checkout only the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use pinned free runner Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate immutable OIDC publisher script
        run: node --check scripts/hf-oidc-publish.mjs
      - name: Deliver short-lived GitHub-signed workflow identity to Hatchable
        env:
          ULTRON_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ULTRON_SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run_attempt || '1' }}
        run: node scripts/hf-oidc-publish.mjs
