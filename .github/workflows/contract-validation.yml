name: Ultron zero-credit contract validation
# Ported from Mahoraga contract-validation.yml: zero-credit, zero-secret static
# workflow-reference, Cloudflare parity, and credential-isolation gate on PRs and main.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check GitHub Actions workflow references
        run: node scripts/check-workflow-references.mjs
      - name: Check Cloudflare Worker config and cron parity
        run: node scripts/check-cloudflare-parity.mjs
      - name: Audit source for accidental credentials
        run: node scripts/audit-secret-isolation.mjs
