name: Verify secondary Admin App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: scoped-installation-token-readback
    runs-on: ubuntu-latest
    environment: ultron-secondary-admin
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - name: Verify token minting and canonical repository readback
        env:
          SECONDARY_ADMIN_APP_ID: ${{ vars.ULTRON_SECONDARY_ADMIN_APP_ID }}
          SECONDARY_ADMIN_INSTALLATION_ID: ${{ vars.ULTRON_SECONDARY_ADMIN_INSTALLATION_ID }}
          ULTRON_SECONDARY_ADMIN_PRIVATE_KEY: ${{ secrets.ULTRON_SECONDARY_ADMIN_PRIVATE_KEY }}
        run: node scripts/verify-secondary-admin.mjs
