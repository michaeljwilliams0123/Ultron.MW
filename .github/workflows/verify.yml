name: Ultron core verification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/app.js'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/learning.mjs
          node --check src/operations.mjs
          node --check src/server.mjs
          node --check docs/app.js
      - name: Core regression suite
        run: node --test test/*.test.mjs
