name: Ultron core verification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/learning.mjs
          node --check src/experience.mjs
          node --check src/operations.mjs
          node --check src/server.mjs
          node --check src/action-gateway.mjs
          node --check src/brain.mjs
          node --check src/providers/ollama.mjs
          node --check docs/app.js
          node --check docs/browser-brain.mjs
          node --check docs/browser-vault.mjs
          node --check docs/core/cycle.mjs
          node --check docs/core/providers.mjs
          for file in test/*.test.mjs; do node --check "$file"; done
      - name: Core regression suite
        run: node --test test/*.test.mjs
