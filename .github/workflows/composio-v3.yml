name: Ultron Composio v3 isolated SDK verification
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'integrations/composio/**'
      - 'src/composio-v3-policy.mjs'
      - 'test/composio-*.test.mjs'
      - 'cloud/hatchable/lib/composio-v3-policy.js'
      - 'cloud/hatchable/api/brain/composio-v3.js'
      - 'cloud/hatchable/migrations/0046_composio_sessions.sql'
      - '.github/workflows/composio-v3.yml'
permissions:
  contents: read
jobs:
  isolated-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure safe git policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Enforce SDK Node engine
        run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number);if(a<22||(a===22&&(b<22||(b===22&&c<3))))process.exit(1)"
      - name: Install audited repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated pinned SDK without lifecycle scripts
        run: npm install --prefix integrations/composio --ignore-scripts --no-audit --no-fund --save-exact
      - name: SDK integration contract checks (no live keys)
        run: npm test --prefix integrations/composio
      - name: Root policy, SQL and Hatchable parity regressions
        run: node --test test/composio-v3-policy.test.mjs test/composio-migration-0046.test.mjs test/composio-v3-hatchable-parity.test.mjs
      - name: Route reference audit
        run: node scripts/audit-route-references.mjs > /tmp/ultron-route-audit.json
      - name: Fast baseline verification
        run: node scripts/verify-fast.mjs
      - name: Validate Phase 7 primary canary without credentials
        run: node integrations/composio/verify-live-primary.mjs --dry-run
