name: Autonomous Release Authorization
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Authorization mode (decision-only, authorize, or owner-policy auto)'
        required: true
        default: 'decision-only'
        type: choice
        options:
          - decision-only
          - authorize
          - auto
  workflow_run:
    workflows: ["Ultron core verification"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: ultron-release-authorization-main
  cancel-in-progress: false

jobs:
  authorize-release-receipt:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.id == 1424939667 &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-24.04
    environment: production-autonomous-release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Evaluate independently discovered production release
        env:
          POLICY_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience','ultron.release-authorizer.v1');
          const token = await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:'error',signal:AbortSignal.timeout(10000)});
          if(!token.ok) throw Error('oidc-unavailable');
          const {value}=await token.json();
          if(typeof value!=='string')throw Error('oidc-invalid');
          const result=await fetch('https://ultron-mw-cloud.hatchable.site/api/brain/deployment-release-authorize',{
            method:'POST',redirect:'error',signal:AbortSignal.timeout(90000),
            headers:{Authorization:'Bearer '+value,'Content-Type':'application/json'},
            body:JSON.stringify({mode:process.env.POLICY_MODE})
          });
          const body=await result.json();
          console.log(JSON.stringify({status:result.status,decision:body.decision,reason:body.reason,mode:body.mode,receiptId:body.receiptId}));
          if(result.status>=500||result.status===401||!['authorized','denied','human-required'].includes(body.decision))process.exitCode=1;
          NODE
