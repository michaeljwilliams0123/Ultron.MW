name: Ultron Create PR to main
on:
  workflow_call:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: ultron-pr-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  create-pr:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      ((github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        github.event.issue.user.login == 'michaeljwilliams0123' &&
        ((github.event.issue.title == '[Ultron PR] Create proposal' &&
          startsWith(github.event.issue.body, 'ULTRON_PR_V1')) ||
         (github.event.issue.title == '[Ultron PR] Implement code' &&
          startsWith(github.event.issue.body, 'ULTRON_CODE_PR_V1')))) ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.comment.user.login == 'michaeljwilliams0123' &&
        github.event.issue.user.login == 'michaeljwilliams0123' &&
        github.event.issue.state == 'open' &&
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '@ultron implement ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify trusted PR adapter
        run: |
          node --check src/cloud-pr.mjs
          node --check src/code-pr.mjs
          node --check src/council-room-execution.mjs
      - name: Create and verify owner issue handoff
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/council-room-execution.mjs
      - name: Create and verify PR targeting main
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/cloud-pr.mjs
