name: Isolated tool proposal execution
on:
  workflow_dispatch:
    inputs:
      source_base64:
        description: Base64 encoded candidate module, never production credentials
        required: true
        type: string
      source_sha256:
        description: SHA-256 of exact candidate bytes
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    if: github.ref == 'refs/heads/main' && github.actor == 'michaeljwilliams0123' && vars.ULTRON_ZERO_COST_ACTIONS_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run candidate in restricted container
        env:
          ULTRON_SOURCE_BASE64: ${{ inputs.source_base64 }}
          ULTRON_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: node scripts/actions-isolated-executor.mjs
      - name: Preserve bounded host observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: executor-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: executor-observation.json
          retention-days: 7
          if-no-files-found: error
