name: Ultron C03 Codex owner trigger provenance
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  codex-trigger-audit:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.event.comment.user.login == 'michaeljwilliams0123' &&
      github.event.issue.pull_request != null &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/codex run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Audit exact owner request and branch evidence without external dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/codex-trigger-audit.mjs
