name: Council worker
# Phase 2: short-lived GitHub-hosted execution worker. Hatchable stays the brain/ledger.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: 'Worker request JSON (objectiveId, op, role, sourceSha, params, issueNumber)'
        required: true
        type: string
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: council-worker-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  work:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'michaeljwilliams0123' &&
        ((github.event.issue.title == '[Ultron Worker] Browser execution' &&
          startsWith(github.event.issue.body, 'ULTRON_BROWSER_ACTION_V1')) ||
         (github.event.issue.title == '[Ultron Worker] Browser external acceptance' &&
          startsWith(github.event.issue.body, 'ULTRON_BROWSER_WRITE_V1')))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Playwright for browser objectives
        if: contains(inputs.request, 'browser.check') || contains(inputs.request, 'browser.action') || contains(inputs.request, 'browser.external-write') || (github.event_name == 'issues' && (github.event.issue.title == '[Ultron Worker] Browser execution' || github.event.issue.title == '[Ultron Worker] Browser external acceptance'))
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Check bounded browser and worker source
        run: |
          node --check src/browser-action.mjs
          node --check src/browser-external-write.mjs
          node --check src/council-worker.mjs
          node --check scripts/council-worker.mjs
      - name: Execute objective with ledger, timeout and post-action verification
        env:
          WORKER_REQUEST: ${{ inputs.request }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAHORAGA_REPOSITORY: ${{ vars.MAHORAGA_REPOSITORY }}
          MAHORAGA_READ_TOKEN: ${{ secrets.MAHORAGA_READ_TOKEN }}
        run: timeout 240 node scripts/council-worker.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: council-worker-result
          path: council-worker-result.json
          if-no-files-found: ignore
          retention-days: 14
