name: Council identity proof
# Phase 3: mint ONE role's GitHub App installation token and prove (by GitHub readback)
# that the App - not github-actions - authored a comment. Owner-dispatched only.
on:
  workflow_dispatch:
    inputs:
      role:
        description: Council role to prove (each has its own variable and secret)
        required: true
        type: choice
        options: [BUILDER, SKEPTIC, STEWARD, PREDICTOR, GENERATOR, SENTINEL, COMPANION]
        default: BUILDER
      issue_number:
        description: Issue or PR number to receive the proof comment
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: council-identity-proof-${{ inputs.role }}
  cancel-in-progress: false
jobs:
  prove:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Mint short-lived installation token for this role only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars[format('ULTRON_{0}_CLIENT_ID', inputs.role)] }}
          private-key: ${{ secrets[format('ULTRON_{0}_PRIVATE_KEY', inputs.role)] }}
          repositories: Ultron.MW
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
      - name: Post proof comment as the App and verify authorship by readback
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          ROLE_UPPER: ${{ inputs.role }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          export COUNCIL_ROLE="$(node -e "const r=process.env.ROLE_UPPER;console.log(r[0]+r.slice(1).toLowerCase())")"
          node scripts/council-identity-proof.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: council-identity-proof-${{ inputs.role }}
          path: council-identity-proof.json
          if-no-files-found: ignore
          retention-days: 90
