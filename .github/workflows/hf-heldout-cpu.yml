name: Ultron Hugging Face held-out CPU repairs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultron-hf-heldout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  heldout-evaluation:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.event.repository.private == false &&
      github.actor == 'michaeljwilliams0123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [baseline, coder-small, coder-medium, coder-large]
        shard: [0, 1]
    env:
      ULTRON_REPOSITORY_PUBLIC: 'true'
      ULTRON_RUNNER_LABEL: ubuntu-24.04
      ULTRON_HF_PROFILE: ${{ matrix.profile }}
      ULTRON_HF_SHARD: ${{ matrix.shard }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install audited locked CPU model runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/verify-audited-lockfile.mjs
      - name: Execute frozen multi-line repair cases with no paid fallback
        run: node scripts/hf-heldout-cpu.mjs
      - name: Preserve immutable model and behavior scoring evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hf-heldout-${{ matrix.profile }}-s${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/hf-heldout/*.json
          if-no-files-found: error
          retention-days: 7
