name: Ultron PR conversation brain
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: ultron-pr-brain-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
jobs:
  converse:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      github.event.comment.user.login == 'michaeljwilliams0123' &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null) ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.number > 0))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate PR conversation source
        run: |
          node --check src/pr-brain.mjs
          node --check src/pr-brain-patch.mjs
      - name: Route PR comment through Ultron brain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/pr-brain.mjs
