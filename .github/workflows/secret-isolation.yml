name: Ultron source credential isolation audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-secret-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify source scanner denies valid keys and PATs
        run: node --test test/secret-isolation-audit.test.mjs
      - name: Scan tracked source and refuse unsafe material
        run: node scripts/audit-secret-isolation.mjs
