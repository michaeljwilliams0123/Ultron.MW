name: Ultron source credential isolation audit
# Optional owner-invoked source scanner; mandatory CI enforcement remains in verify.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultron-secret-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-secret-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify source scanner negative controls
        run: node --test test/secret-isolation-audit.test.mjs
      - name: Scan source without exposing credential values
        run: node scripts/audit-secret-isolation.mjs
