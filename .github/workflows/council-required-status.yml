name: Ultron trusted Council release status
# Trusted Council 7/7 gate (v2). PR-target, owner-comment and owner-only
# workflow_dispatch recheck load trusted `main`; the PR
# branch is never checked out or executed. PR title, body, file list, reviews
# and comments are read through the API as data. The result is published as a
# check run by a dedicated GitHub App, so no other workflow can forge it.
# Without that App configured, nothing is published and the gate stays closed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  # Dependency trigger: core VERIFY must finish before a Gate App decision.
  # Privileged job still checks out only trusted main, never PR code.
  workflow_run:
    workflows: ["Ultron core verification"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Ultron.MW PR number to recheck without writing a comment'
        required: true
        type: number
permissions:
  contents: read
jobs:
  trusted-council-status:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.id == 308995719 &&
        (startsWith(github.event.comment.body, '/council override ') ||
         startsWith(github.event.comment.body, '/council recheck'))) ||
       (github.event_name == 'workflow_run' &&
        github.event.action == 'completed' &&
        github.event.workflow_run.workflow_id == 388875616 &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == 1424939667 &&
        github.event.workflow_run.pull_requests[0].number > 0) ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'michaeljwilliams0123' &&
        github.actor_id == '308995719' &&
        github.ref == 'refs/heads/main' &&
        inputs.pr_number > 0))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: trusted-council-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      id-token: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned AST parser for main-only code inspection
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read live PR, changed files, reviews and owner comments as data
        id: prepare
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const gate=await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE,'src/council-trusted-gate.mjs')).href);
            const {owner,repo}=context.repo;
            const number=gate.selectCouncilTargetNumber(context.eventName,context.payload);
            if(!Number.isSafeInteger(number)||number<1){core.setOutput('skip','true');return;}
            const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(pr.state!=='open'||pr.base?.ref!=='main'||
               pr.head?.repo?.id!==1424939667||pr.base?.repo?.id!==1424939667){
              core.setOutput('skip','true');return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,
              {owner,repo,pull_number:number,per_page:100});
            const reviews=await github.paginate(github.rest.pulls.listReviews,
              {owner,repo,pull_number:number,per_page:100});
            const comments=await github.paginate(github.rest.issues.listComments,
              {owner,repo,issue_number:number,per_page:100});
            const live=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            if(gate.exactHeadReadState(pr,live)==='superseded'){
              core.notice('Council run superseded during data read; newer exact-head run owns the decision.');
              core.setOutput('skip','true');return;
            }
            // A completed run might be superseded by a newer PR head/base;
            // GitHub's workflow_run.run-name is not a trustworthy identifier.
            if(context.eventName==='workflow_run' &&
              (context.payload.workflow_run.head_sha!==pr.head.sha||
               context.payload.workflow_run.pull_requests?.[0]?.base?.sha!==pr.base.sha)){
              core.notice('Completed CI belongs to a superseded exact PR head/base.');
              core.setOutput('skip','true');return;
            }
            const complete=files.length===pr.changed_files&&files.length<3000;
            const override=[...comments].reverse().find(c=>
              gate.isOwnerAccount(c.user)&&typeof c.body==='string'&&
              c.body.startsWith('/council override '))||null;
            const intent=gate.ownerIntent(pr,reviews);
            const risk=gate.classifyTrustedRisk({files,filesComplete:complete});
            const dir=path.join(process.env.RUNNER_TEMP,'trusted-council');
            fs.mkdirSync(dir,{recursive:true});
            const write=(name,value)=>{const p=path.join(dir,name);
              fs.writeFileSync(p,typeof value==='string'?value:JSON.stringify(value));return p;};
            const slim={number:pr.number,state:pr.state,user:pr.user,
              head:{sha:pr.head.sha,ref:pr.head.ref,repo:{id:pr.head.repo.id,full_name:pr.head.repo.full_name}},
              base:{sha:pr.base.sha,ref:pr.base.ref,repo:{id:pr.base.repo.id,full_name:pr.base.repo.full_name}}};
            // Read exact-head CI in the trusted main-only job as well as the
            // advisory debate. Missing/failed evidence remains a HOLD.
            let observed={};
            try {
              const [checks,comparison]=await Promise.all([
                github.rest.checks.listForRef({owner,repo,ref:pr.head.sha,per_page:100}),
                github.rest.repos.compareCommits({owner,repo,base:pr.base.sha,head:pr.head.sha})
              ]);
              if(!gate.councilExactHeadCiReady(checks.data,pr.head.sha)){
                core.notice('Council CI incomplete; deferring Gate App decision until all exact-head checks finish.');
                core.setOutput('skip','true');return;
              }
              observed={pr,comparison:comparison.data,checkRuns:checks.data};
            } catch(error) {
              core.warning('Council CI evidence remains unverified: '+error.message);
              core.setOutput('skip','true');return;
            }
            core.exportVariable('COUNCIL_REVIEW_EVIDENCE_FILE',write('exact-head-ci.json',observed));
            // Trusted-main-only exact-head source context; no arbitrary PR
            // code execution and no raw patch logging/provider forwarding.
            const patchComplete=complete&&files.length<=80&&
              files.every(f=>!f.patch||f.patch.length<=2400);
            core.exportVariable('COUNCIL_PR_FILES_FILE',write('exact-head-pr-files.json',{
              sourceSha:pr.head.sha,prNumber:pr.number,complete:patchComplete,
              files:files.slice(0,80).map(f=>({
                filename:f.filename,status:f.status,
                additions:f.additions,deletions:f.deletions,
                patch:typeof f.patch==='string'?f.patch.slice(0,2400):''
              }))
            }));
            // Source is fetched at the verified PR head and parsed as data;
            // only bounded taint findings are persisted, never raw code.
            try{
              const {scanCouncilChangedFiles}=await import(pathToFileURL(
                path.join(process.env.GITHUB_WORKSPACE,'src/council-taint-evidence.mjs')).href);
              const sources=[];
              const candidates=files.filter(f=>f.status!=='removed'&&
                /\.(?:mjs|cjs|js|ts|tsx|jsx)$/.test(f.filename)).slice(0,6);
              for(const f of candidates){
                let source=null;
                try{
                  const response=await github.rest.repos.getContent({
                    owner,repo,path:f.filename,ref:pr.head.sha
                  });
                  const d=response.data;
                  if(!Array.isArray(d)&&d?.type==='file'&&d.size<=64000&&
                    d.encoding==='base64'&&typeof d.content==='string')
                    source=Buffer.from(d.content,'base64').toString('utf8');
                }catch{}
                sources.push({filename:f.filename,source});
              }
              const liveAgain=(await github.rest.pulls.get({
                owner,repo,pull_number:number
              })).data;
              if(gate.exactHeadReadState(pr,liveAgain)==='superseded'){
                core.notice('Council run superseded during bounded source read; newer exact-head run owns the decision.');
                core.setOutput('skip','true');return;
              }
              const e=scanCouncilChangedFiles({
                sourceSha:pr.head.sha,prNumber:number,sources
              });
              core.exportVariable('COUNCIL_TAINT_EVIDENCE_FILE',write(
                'exact-head-ast-taint.json',e));
              core.info('Bounded Council AST scan source files: '+e.scannedFiles);
            }catch(error){
              core.warning?.('Council AST scan unavailable: '+error.message);
            }
            core.exportVariable('COUNCIL_PR_FILE',write('pr.json',slim));
            core.exportVariable('COUNCIL_FILES_FILE',write('files.json',
              {complete,files:files.map(f=>({filename:f.filename,previous_filename:f.previous_filename,status:f.status}))}));
            core.exportVariable('COUNCIL_OVERRIDE_FILE',write('override.json',override));
            core.exportVariable('TITLE_FILE',write('title.txt',String(pr.title||'').slice(0,240)));
            core.exportVariable('BODY_FILE',write('body.txt',String(pr.body||'').slice(0,8000)));
            core.exportVariable('ITEM_NUMBER',String(pr.number));
            core.exportVariable('TARGET_SOURCE_SHA',pr.head.sha);
            core.exportVariable('TARGET_BASE_SHA',pr.base.sha);
            core.exportVariable('IS_PR','true');
            core.exportVariable('OWNER_MODE',intent.owner?'1':'0');
            // From the trusted file list, never from PR text (Skeptic H2).
            core.exportVariable('ORIGINAL_SECURITY_SIGNAL',risk.security?'1':'0');
            core.info('Owner intent: '+(intent.via||'none')+'; security paths: '+
              (risk.securityPaths.join(', ')||'none')+'; files complete: '+complete);
            core.setOutput('skip','false');
      - name: Run Council debate from main on PR data
        id: debate
        if: steps.prepare.outputs.skip == 'false'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Trusted pull_request_target runs only main-controlled source, not PR code.
          COUNCIL_MASTER_SEED: ${{ secrets.COUNCIL_MASTER_SEED }}
        run: |
          set -euo pipefail
          TITLE=$(cat "$TITLE_FILE")
          BODY=$(cat "$BODY_FILE")
          export TITLE BODY
          node scripts/council-debate.mjs
      - name: Verify seven role attestations with protected root and exact head
        id: role-attestation
        if: steps.prepare.outputs.skip == 'false'
        continue-on-error: true
        env:
          COUNCIL_MASTER_SEED: ${{ secrets.COUNCIL_MASTER_SEED }}
        run: node scripts/verify-council-role-attestations.mjs
      - name: Retain exact-head role-attestation evidence
        if: steps.prepare.outputs.skip == 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: council-signed-role-evidence-${{ github.run_id }}
          path: |
            council-role-attestations.json
            council-role-attestation-verification.json
            council-receipt.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Apply seven-of-seven policy from main
        id: evaluate
        if: steps.prepare.outputs.skip == 'false'
        continue-on-error: true
        env:
          COUNCIL_EVIDENCE_DIRECTORY: ${{ github.workspace }}
        run: node scripts/enforce-council-acceptance.mjs
      - name: Execute one real Coordinator PR COMMENT review with durable readback
        if: >-
          steps.prepare.outputs.skip == 'false' &&
          github.event_name != 'workflow_run' &&
          env.OWNER_MODE == '1' &&
          vars.ULTRON_GITHUB_APP_ID == '5633654'
        continue-on-error: true
        env:
          COUNCIL_COORDINATOR_APP_ID: ${{ vars.ULTRON_GITHUB_APP_ID }}
          COUNCIL_COORDINATOR_PRIVATE_KEY: ${{ secrets.ULTRON_BUILDER_PRIVATE_KEY }}
        run: |
          if [ -f scripts/council-live-review.mjs ]; then
            node scripts/council-live-review.mjs
          else
            echo "Council live review not yet on trusted main; no action."
          fi
      - name: Retain Council execution evidence
        if: always() && steps.prepare.outputs.skip == 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: council-live-review-${{ github.run_id }}
          path: council-live-review-result.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Mint dedicated Council Gate App token
        id: app
        if: steps.prepare.outputs.skip == 'false' && vars.COUNCIL_GATE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COUNCIL_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COUNCIL_GATE_APP_PRIVATE_KEY }}
          repositories: Ultron.MW
          permission-checks: write
          permission-pull-requests: read
      - name: Publish check run as the Council Gate App
        if: steps.prepare.outputs.skip == 'false' && steps.app.outputs.token != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GATE_APP_ID: ${{ vars.COUNCIL_GATE_APP_ID }}
          GATE_APP_SLUG: ${{ vars.COUNCIL_GATE_APP_SLUG }}
          MINTED_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs=require('node:fs'),path=require('node:path');
            const {pathToFileURL}=require('node:url');
            const gate=await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE,'src/council-trusted-gate.mjs')).href);
            const publisher=gate.resolveGatePublisher({appId:process.env.GATE_APP_ID,
              expectedSlug:process.env.GATE_APP_SLUG,mintedSlug:process.env.MINTED_APP_SLUG});
            if(!publisher)throw Error('Council Gate App identity mismatch; refusing to publish');
            const {owner,repo}=context.repo;
            const sha=process.env.TARGET_SOURCE_SHA,number=Number(process.env.ITEM_NUMBER);
            const live=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
            const expected={number,state:'open',head:{sha},base:{sha:process.env.TARGET_BASE_SHA}};
            if(gate.exactHeadReadState(expected,live)==='superseded'){
              core.notice('Council run superseded before publish; newer exact-head run owns the decision.');
              return;
            }
            let result=null;
            try{result=JSON.parse(fs.readFileSync('council-release-gate.json','utf8'));}catch{result=null;}
            const body=gate.buildGateCheckRun(result,{sha,prNumber:number,
              detailsUrl:'https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId});
            await github.rest.checks.create({owner,repo,...body});
            core.info('Published '+body.conclusion+' '+body.name+' on '+sha);
      - name: Fail closed when the Council Gate App is not configured
        if: steps.prepare.outputs.skip == 'false' && steps.app.outputs.token == ''
        run: |
          echo "::error::Council Gate App not configured (vars.COUNCIL_GATE_APP_CLIENT_ID). No ultron/council-7of7 check published; the gate stays closed. See docs/COUNCIL-7OF7-ENFORCEMENT.md."
          exit 1
