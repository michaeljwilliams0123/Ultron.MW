name: Ultron ops audit lane
# Council lane 'ops-audit' (Sentinel). Consolidates live-acceptance-audit.yml,
# self-scan-pr.yml, gitlab-mirror.yml, reef-runtime-probe.yml and
# council-self-repair.yml. Every legacy job keeps its own trigger, branch
# filter, cron, permissions and concurrency through its job-level `if`.
on:
  workflow_run:
    workflows: ["Ultron core verification"]
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '27 9 * * *'
    - cron: '17 * * * *'
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      ops_task:
        description: Which ops job to run (default keeps the old self-scan-pr.yml dispatch behavior)
        required: true
        type: choice
        default: self-scan-pr
        options:
          - self-scan-pr
          - live-acceptance-audit
          - gitlab-mirror
          - reef-runtime-probe
          - council-self-repair
      run_id:
        description: 'council-self-repair: completed workflow run ID to diagnose (blank = sweep)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'schedule' && github.event.schedule == '27 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'live-acceptance-audit')) &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
      )
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ultron-live-readonly-audit-audit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate audit syntax and invariants
        run: |
          node --check src/live-acceptance-audit.mjs
          node --check scripts/live-acceptance-audit.mjs
          node --test test/live-acceptance-audit.test.mjs
      - name: Observe exact GitHub main, Pages, and Hatchable boundaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/live-acceptance-audit.mjs
      - name: Publish non-sensitive evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-public-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/live-acceptance/
          if-no-files-found: warn
          retention-days: 14

  self-scan-pr:
    if: >-
      ((github.event_name == 'schedule' && github.event.schedule == '17 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'self-scan-pr')) &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == 'michaeljwilliams0123'))
      )
    concurrency:
      group: ultron-self-scan-publication-self-scan-pr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate source-bound PR launcher
        run: |
          node --check src/self-observer.mjs
          node --check src/self-scan-pr.mjs
      - name: Observe current main and publish findings PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/self-scan-pr.mjs
      - name: Report hourly CI status (GitHub-native; optional Datadog)
        if: ${{ always() && github.repository == 'michaeljwilliams0123/Ultron.MW' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ULTRON_ENABLE_DATADOG: ${{ vars.ULTRON_ENABLE_DATADOG || '0' }}
          ULTRON_DATADOG_SITE: ${{ vars.ULTRON_DATADOG_SITE || 'datadoghq.com' }}
          ULTRON_DATADOG_API_KEY: ${{ secrets.ULTRON_DATADOG_API_KEY }}
        run: node scripts/ci-observability-snapshot.mjs

  mirror:
    # Disabled until owner adds a scoped secret and explicitly enables the variable.
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'gitlab-mirror')) &&
      (
      vars.ULTRON_GITLAB_MIRROR_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
      )
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm independent successful Verify for exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          # Manual dispatch does not inherit a successful workflow_run.
          # Require actual verified main push result, not a green run for an older head.
          verified="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?branch=main&event=push&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$candidate\" and .head_branch == \"main\" and .status == \"completed\" and .conclusion == \"success\") | .id")"
          if test -z "$verified"; then
            echo "BLOCKED: no successful independent main Verify for exact SHA $candidate" >&2
            exit 1
          fi
      - name: Verify canonical head then fast-forward GitLab with exact SHA readback
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.ULTRON_GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if test -z "$GITLAB_TOKEN"; then
            echo 'BLOCKED: ULTRON_GITLAB_MIRROR_TOKEN not configured' >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          current_main="$(git ls-remote https://github.com/michaeljwilliams0123/Ultron.MW.git refs/heads/main | awk '{print $1}')"
          if test "$source_sha" != "$current_main"; then
            echo 'BLOCKED: exact-head GitHub main changed since verification' >&2
            exit 1
          fi
          # Header is runtime-only and never stored in source or remote config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://gitlab.com/.extraheader
          mirror_auth="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $mirror_auth"
          bash scripts/mirror-gitlab.sh https://gitlab.com/michaelj.williams0123/Ultron.MW.git

  reef-runtime-probe:
    if: >-
      github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'reef-runtime-probe')
    permissions:
      contents: read
    concurrency:
      group: reef-probe-${{ github.event.pull_request.number || github.ref }}-reef-runtime-probe
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the zero-paid, ephemeral runner environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          git lfs version
          python3 -m venv "$RUNNER_TEMP/reef-venv"
          source "$RUNNER_TEMP/reef-venv/bin/activate"
          python -m pip --version
      - name: Run Reef evidence fail-closed contract tests
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/reef-venv/bin/activate"
          python -m unittest discover -s test -p 'test_reef*.py' -v
          node --test test/reef-paired-cases.test.mjs
      - name: Install and verify fixed upstream Reef wheel
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/reef-venv/bin/activate"
          mkdir -p "$RUNNER_TEMP/reef-wheel"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/reef-wheel" reef-infra==0.1.3
          printf '%s  %s\n' 'c676d1b3ace72118122978bf2935a8d937a6dff4acfdab3d64887a0971d42e72' "$RUNNER_TEMP/reef-wheel/reef_infra-0.1.3-py3-none-any.whl" | sha256sum --check
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/reef-wheel/reef_infra-0.1.3-py3-none-any.whl"
          python -c 'import reef; import importlib.metadata; assert importlib.metadata.version("reef-infra") == "0.1.3"'
          reef --version
      - name: Verify real Reef serve, inference record, feedback and release list
        shell: bash
        env:
          ULTRON_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/reef-venv/bin/activate"
          python scripts/reef_ci_probe.py
      - name: Evaluate base and candidate Repair App policy against actual checked-in cases
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          evaluator="scripts/reef-paired-cases.mjs"
          if git cat-file -e "${BASE_SHA}:scripts/reef-paired-cases.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/reef-paired-cases.mjs" > "$RUNNER_TEMP/reef-paired-base.mjs"
            evaluator="$RUNNER_TEMP/reef-paired-base.mjs"
            echo "BASE_EVALUATOR_USED=true" >> "$GITHUB_ENV"
          else
            # First bootstrap PR: candidate-authored evaluator is never
            # evidence of an independent held-out evaluator.
            echo "BASE_EVALUATOR_USED=false" >> "$GITHUB_ENV"
          fi
          node "$evaluator" "$BASE_SHA" "$HEAD_SHA" artifacts/reef-paired-source-benchmark.json
      - name: Report independently observed case scores to real Reef receipts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/reef-venv/bin/activate"
          python scripts/reef_paired_feedback.py
      - name: Upload runtime-only evidence, never credentials or logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reef-runtime-probe-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/reef-runtime-probe.json
            artifacts/reef-paired-source-benchmark.json
            artifacts/reef-paired-feedback.json
          if-no-files-found: ignore
          retention-days: 7

  diagnose:
    if: >-
      (github.event_name == 'workflow_run' || (github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'council-self-repair')) &&
      (
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      vars.ULTRON_SELF_REPAIR_MODE != 'off' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'michaeljwilliams0123') ||
       (github.event_name == 'workflow_run' &&
        contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) &&
        (github.event.workflow_run.head_branch == 'main' ||
         github.event.workflow_run.actor.login == 'michaeljwilliams0123' ||
         github.event.workflow_run.actor.login == 'michaeljwilliams0123ultron')))
      )
    concurrency:
      group: council-self-repair-${{ github.event.workflow_run.id || github.run_id }}-diagnose
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      act: ${{ steps.plan.outputs.act }}
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Diagnose and plan (no writes)
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_REPAIR_MODE: ${{ vars.ULTRON_SELF_REPAIR_MODE || 'report-only' }}
          SELF_REPAIR_AGENT: ${{ vars.ULTRON_SELF_REPAIR_AGENT || 'none' }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -n "$RUN_ID" ]; then node scripts/council-self-repair.mjs --run "$RUN_ID"
          else node scripts/council-self-repair.mjs --sweep; fi

  act:
    needs: diagnose
    if: >-
      (github.event_name == 'workflow_run' || (github.event_name == 'schedule' && github.event.schedule == '23 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.ops_task == 'council-self-repair')) &&
      (
      needs.diagnose.outputs.act == 'true' && vars.ULTRON_SELF_REPAIR_MODE == 'act'
      )
    concurrency:
      group: council-self-repair-${{ github.event.workflow_run.id || github.run_id }}-act
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Configure Git bare-repository policy
        run: git config --global safe.bareRepository explicit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Execute allow-listed repairs (rerun once, diagnosis issue, draft handoff, update-branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_REPAIR_MODE: act
          SELF_REPAIR_AGENT: ${{ vars.ULTRON_SELF_REPAIR_AGENT || 'none' }}
          SELF_REPAIR_ASSIGN_TOKEN: ${{ secrets.ULTRON_COPILOT_ASSIGN_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [ -n "$RUN_ID" ]; then node scripts/council-self-repair.mjs --run "$RUN_ID" --execute
          else node scripts/council-self-repair.mjs --sweep --execute; fi
