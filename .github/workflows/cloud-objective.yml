name: Ultron hosted objective
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      objective:
        description: One-line read-only Ultron objective
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: ultron-cloud-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  cloud:
    if: >-
      github.repository == 'michaeljwilliams0123/Ultron.MW' &&
      github.actor == 'michaeljwilliams0123' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        github.event.issue.user.login == 'michaeljwilliams0123' &&
        github.event.issue.title == '[Ultron Cloud] Objective') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.user.login == 'michaeljwilliams0123' &&
        github.event.comment.user.login == 'michaeljwilliams0123' &&
        startsWith(github.event.comment.body, 'ULTRON_FEEDBACK_V1') &&
        startsWith(github.event.issue.body, 'ULTRON_CLOUD_V1')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate hosted executor
        run: |
          node --check src/cloud-cycle.mjs
          node --check src/cloud-feedback.mjs
          node --check src/cloud-entry.mjs
      - name: Execute and persist GitHub receipt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/cloud-entry.mjs
